<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Wonda Luxe</title>
  <meta name="description" content="Wonda Luxe – luxury cosmetics, skincare and fragrances in Abuja, Nigeria. Order easily via WhatsApp.">
  <meta property="og:title" content="Wonda Luxe | Luxury Cosmetics &amp; Fragrances">
  <meta property="og:description" content="Premium cosmetics, skincare and fragrances. Checkout via WhatsApp.">
  <meta property="og:image" content="assets/images/571955.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💄%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <div class="navbar">
      <a href="index.html" class="logo">Wonda <span>Luxe</span></a>
      <nav aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="index.html#contact">Contact</a></li>
        </ul>
      </nav>
      <button type="button" class="cart-btn" onclick="openCart()" aria-label="Open cart">
        🛒 Cart <span class="cart-count">0</span>
      </button>
    </div>
  </header>

  <section class="container">
    <h2 class="section-title">All Products</h2>
    <div class="filters" id="filters">
      <button type="button" class="filter-btn active" data-cat="all">All</button>
      <button type="button" class="filter-btn" data-cat="Face">Face</button>
      <button type="button" class="filter-btn" data-cat="Lips">Lips</button>
      <button type="button" class="filter-btn" data-cat="Eyes">Eyes</button>
      <button type="button" class="filter-btn" data-cat="Fragrance">Fragrance</button>
      <button type="button" class="filter-btn" data-cat="Body Care">Body Care</button>
      <button type="button" class="filter-btn" data-cat="Accessories">Accessories</button>
    </div>
    <div class="products-grid" id="products-grid"></div>
  </section>

  <footer>
    <p>&copy; 2026 Wonda Luxe. All rights reserved.</p>
    <p>WhatsApp: <a class="footer-link" href="tel:+2348064674290">08064674290</a></p>
    <p>Abuja, Nigeria</p>
  </footer>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function filterProducts(cat) {
      const list = cat === 'all' ? products : products.filter(p => p.category === cat);
      renderProductGrid('products-grid', list, true);
    }

    function initPage() {
      const filters = document.getElementById('filters');
      filters.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterProducts(btn.dataset.cat);
        history.replaceState(null, '', btn.dataset.cat === 'all' ? 'shop.html' : '#' + encodeURIComponent(btn.dataset.cat));
      });
      const hash = decodeURIComponent(location.hash.slice(1));
      const start = hash && document.querySelector(`.filter-btn[data-cat="${hash}"]`);
      if (start) start.click(); else filterProducts('all');
    }
  </script>
</body>
</html>
